<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Minhas Crianças</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/campanhas">
        <ion-icon name="megaphone-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for (crianca of (criancas$ | async); track crianca.id) {
      <ion-item (click)="abrirCarteira(crianca.id!)">
        <ion-label>
          <h2>{{ crianca.nome }}</h2>
          <p>{{ crianca.idadeFormatada() }}</p>
        </ion-label>
        <ion-button fill="clear" slot="end" [routerLink]="['/criancas', crianca.id, 'editar']" (click)="$event.stopPropagation()">
          <ion-icon name="pencil" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" slot="end" color="danger" (click)="deletarCrianca(crianca.id!); $event.stopPropagation()">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
    } @empty {
      <div class="estado-vazio">
        <p>Nenhuma criança cadastrada ainda.</p>
        <p>Toque no botão "+" para adicionar a primeira.</p>
      </div>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="botao" routerLink="/criancas/adicionar">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab> 


</ion-content>
